[project]
name = "puregaze-main"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.10.0"
dependencies = [
    "easydict>=1.13",
    "facenet-pytorch>=2.5.3",
    "fairlearn>=0.12.0",
    "fairret>=0.1.3",
    "holisticai>=1.0.14",
    "numpy==1.26",
    "opencv-python>=4.11.0.86",
    "packaging>=25.0",
    "pandas>=2.3.2",
    "pillow>=11.3.0",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.7.2",
    "timm>=1.0.27",
    "torch==2.1.1+cu121",
    "torchvision>=0.16.1",
    "vit-pytorch>=1.17.8",
]

[tool.uv]
override-dependencies = [
    "triton; sys_platform == 'never'",
]

[tool.uv.sources]
torch = [
  { index = "torch"},
]

[[tool.uv.index]]
name = "default"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "torch"
url = "https://download.pytorch.org/whl/cu121"
