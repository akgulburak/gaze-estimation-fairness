[project]
name = "mcgaze"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.10"
dependencies = [
    "cityscapesscripts>=2.2.4",
    "cython>=3.1.3",
    "imagecorruptions>=1.1.2",
    "matplotlib>=3.10.5",
    "mmcv-full>=1.7.2",
    "mmdet>=3.3.0",
    "mmengine>=0.10.7",
    "numpy==1.26.4",
    "pandas>=2.3.2",
    "pycocotools>=2.0.10",
    "scikit-learn>=1.7.1",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "setuptools==75.9.0",
    "six>=1.17.0",
    "terminaltables>=3.1.10",
    "timm>=1.0.19",
    "torch==2.0.0+cu118",
    "torchaudio",
    "torchvision==0.15.1+cu118",
    "tqdm>=4.67.1",
    "ultralytics>=8.4.86",
    "yapf<=0.40.1",
]

[tool.uv.sources]
torch = [
  { index = "torch"},
]
torchvision = [
  { index = "torchvision"},
]

[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
]
find-links = [
    "https://download.openmmlab.com/mmcv/dist/cu118/torch2.0/index.html",
]

[[tool.uv.index]]
name = "default"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "torch"
url = "https://download.pytorch.org/whl/cu118"

[[tool.uv.index]]
name = "torchvision"
url = "https://download.pytorch.org/whl/cu118/"
