[project]
name = "l2cs"
version = "0.0.1"
description = "The official PyTorch implementation of L2CS-Net for gaze estimation and tracking"
authors = [
    {name = "Ahmed Abderlrahman"},
    {name = "Thorsten Hempel"}
]
license = {file = "LICENSE.txt"}
readme = "README.md"
requires-python = "==3.10.18"

keywords = ["gaze", "estimation", "eye-tracking", "deep-learning", "pytorch"]

classifiers = [
    "Programming Language :: Python :: 3"
]

dependencies = [
    'matplotlib>=3.3.4',
    'numpy==1.26.4',
    'opencv-python>=4.5.5',
    'pandas>=1.1.5',
    'Pillow>=8.4.0',
    'scipy>=1.5.4',
    'torch==2.1.1+cu121',
    'torchvision',
    'face_detection@git+https://github.com/elliottzheng/face-detection',
    "tqdm>=4.67.1",
    "holisticai>=1.0.14",
    "jax>=0.6.2",
    "optax>=0.2.5",
    "flax>=0.10.7",
    "fairret>=0.1.3",
    "fairlearn>=0.12.0",
]

[tool.uv]
override-dependencies = [
    "triton; sys_platform == 'never'",
]

[tool.uv.sources]
torch = [
  { index = "torch"},
]

[[tool.uv.index]]
name = "default"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "torch"
url = "https://download.pytorch.org/whl/cu121"
